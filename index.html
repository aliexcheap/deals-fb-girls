<title>הציידת: מציאות ודילים מעליאקספרס</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="הציידת - קבוצת וואטסאפ לבנות עם מותגים, מציאות ודילים מעליאקספרס.">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#fff;background:#ffe9ee}
.overlay{height:100vh;height:100dvh;background:url("bg.svg") center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
.container{width:100%;max-width:450px;background:#52102f;border-radius:20px;padding:clamp(14px,3vh,26px) 18px;box-shadow:0 10px 40px rgba(80,20,50,.35)}
.badge{background:#c81616;color:#fff;padding:6px 16px;border-radius:20px;font-size:clamp(.8rem,2.4vh,.95rem);font-weight:700;margin-bottom:clamp(8px,2vh,16px);display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1.07);box-shadow:0 0 0 0 rgba(255,60,60,.9),0 0 22px 6px rgba(255,60,60,.9)}50%{opacity:.92;transform:scale(1);box-shadow:0 0 0 0 rgba(255,60,60,0)}}
h1{font-size:clamp(1.9rem,7vh,2.7rem);margin:0 0 clamp(8px,2vh,14px);line-height:1.1;text-shadow:0 3px 10px rgba(0,0,0,.5)}
h1 span{color:#25d366}
.subtitle{font-size:clamp(1rem,2.8vh,1.2rem);margin:0 0 clamp(14px,3.5vh,26px);line-height:1.5;opacity:.95}
.cta-btn{display:block;width:100%;background:#4ade80;color:#04321a;font-size:clamp(1.2rem,3.6vh,1.5rem);padding:clamp(12px,2.6vh,18px) 20px;border-radius:12px;font-weight:800;text-decoration:none;animation:ripple 2.4s infinite}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6);transform:scale(1)}60%{box-shadow:0 0 0 14px rgba(74,222,128,0);transform:scale(1.02)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0);transform:scale(1)}}
.cta-btn:hover{background:#6ee79a}
.small-note{font-size:clamp(.8rem,2.2vh,.95rem);margin:clamp(10px,2.5vh,18px) 0 0;color:#f3dde6;line-height:1.6}
</style>
</head>
<body>
<main class="overlay">
<div class="container">
<div class="badge">הציידת קבוצת הדילים</div>
<h1>מציאות שוות - <span>ישר לוואטסאפ שלך.</span></h1>
<p class="subtitle">הציידת מוצאת מותגים, קופונים ודילים מעליאקספרס, ואת פשוט נהנית.</p>
<a class="cta-btn" href="https://chat.whatsapp.com/G11rIFR6Ctn5jG26oJiyeR?s=cl&amp;p=i&amp;mlu=4&amp;ilr=4&amp;iam=2" target="_blank" rel="noopener">להצטרפות בחינם</a>
<p class="small-note">ללא עלות · אפשר לצאת בכל עת</p>
</div>
</main>
<script>
// Measures the join-button click, not a confirmed WhatsApp group membership.
// 'Contact' is a Meta standard event, so it can be the optimization event of a
// website-conversion campaign. 'WhatsAppJoinClick' (custom) is kept for reporting
// continuity with the other pages.
document.querySelector('.cta-btn').addEventListener('click', function () {
  if (window.fbq) {
    fbq('track', 'Contact');
    fbq('trackCustom', 'WhatsAppJoinClick');
  }
});
</script>
</body>
</html>
